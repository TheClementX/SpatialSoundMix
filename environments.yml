name: SpatialSoundMix
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - tqdm
  - wandb
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch
      - torchvision
      - torchaudio
      - torchcodec
      - torchmetrics
      - torchinfo
      - scipy 
      - numpy 
      - soundfile